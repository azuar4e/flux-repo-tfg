apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scraper
  name: scraper
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scraper
  template:
    metadata:
      labels:
        app: scraper
    spec:
      containers:
      - image: ghcr.io/azuar4e/scraper-tfg:25 # {"$imagepolicy": "flux-system:scraper-tfg"}
        name: scraper-tfg
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "900m"
            memory: "1Gi"
        envFrom:
        - configMapRef:
            name: microservices-config
        - secretRef:
            name: aws-creds
